<svg xmlns="http://www.w3.org/2000/svg" viewBox="170 230 660 540" width="100%" height="100%">
  <defs>
    <!-- Negative-space mask punching the lightning bolt gap out of the horizontal capsule -->
    <mask id="sparkbar-bolt-cutout">
      <rect x="0" y="0" width="1000" height="1000" fill="white" />
      <polygon
        points="596,262 366,538 484,538 418,733 648,456 532,456"
        fill="black"
        stroke="black"
        stroke-width="42"
        stroke-linejoin="round"
      />
    </mask>
  </defs>

  <!-- Split Horizontal Capsule Pill -->
  <rect
    x="192"
    y="395"
    width="616"
    height="210"
    rx="105"
    ry="105"
    fill="currentColor"
    fill-opacity="0.7"
    mask="url(#sparkbar-bolt-cutout)"
  />

  <!-- Central Lightning Bolt -->
  <polygon
    points="596,262 366,538 484,538 418,733 648,456 532,456"
    fill="currentColor"
  />
</svg>
